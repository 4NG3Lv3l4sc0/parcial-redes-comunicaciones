services:

  database:
    image: postgres:16-alpine
    container_name: parcial_database
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - backend_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  joomla:
    image: joomla:latest
    container_name: parcial_joomla
    command: ["/bin/sh", "-c", "chown -R www-data:www-data /var/www/html && exec apache2-foreground"]
    restart: unless-stopped

    environment:
      JOOMLA_DB_HOST: database:5432
      JOOMLA_DB_TYPE: pgsql
      JOOMLA_DB_NAME: ${JOOMLA_DB_NAME}
      JOOMLA_DB_USER: ${JOOMLA_DB_USER}
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD}

    depends_on:
      database:
        condition: service_healthy

    volumes:
      - ./joomla/site:/var/www/html
      - joomla_logs:/var/log/apache2

    networks:
      - frontend_net
      - backend_net


  jupyter:
    image: jupyter/minimal-notebook:latest
    container_name: parcial_jupyter
    restart: unless-stopped

    command:
      - bash
      - -c
      - |
        pip install --quiet psycopg2-binary &&
        python /opt/scripts/importar_logs.py &
        exec start-notebook.py \
          --ServerApp.token=${JUPYTER_TOKEN} \
          --ServerApp.base_url=/jupyter \
          --ServerApp.allow_remote_access=True

    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
      - ./jupyter/scripts:/opt/scripts:ro
      - nginx_logs:/logs:ro


    networks:
      - frontend_net
      - backend_net


  grafana:
    image: grafana/grafana:latest
    container_name: parcial_grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

    depends_on:
      database:
        condition: service_healthy

    volumes:
      - grafana_data:/var/lib/grafana

      - ./grafana/provisioning:/etc/grafana/provisioning:ro

      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro

      - joomla_logs:/var/log/joomla:ro

    networks:
      - frontend_net
      - backend_net


  nginx:
    image: nginx:alpine
    container_name: parcial_nginx
    restart: unless-stopped

    depends_on:
      - joomla
      - jupyter
      - grafana

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/logs

    networks:
      - frontend_net


networks:

  frontend_net:
    driver: bridge

  backend_net:
    driver: bridge


volumes:

  postgres_data:

  joomla_logs:

  grafana_data:

  nginx_logs:

